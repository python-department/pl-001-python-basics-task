[project]
name = "pl-001-python-basics-task"
version = "0.1.0"
description = "PL-001 course complex task"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 88
src = ["src"]
include = ["*.py", "*.pyi"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
extend-select = ["I", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
norecursedirs = ["25_09", ".venv", "__pycache__"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true