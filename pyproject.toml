[project]
name = "pl-001-python-basics-task"
version = "0.1.0"
description = "PL-001 course complex task"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 88
src = ["src"]
include = ["*.py", "*.pyi"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
extend-select = ["I", "Q"]
per-file-ignores = { "src/part2/storage.py" = ["PYI064"], "src/part2/cart.py" = ["PYI064"] }

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true

[tool.mypy]
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
